[project]
name = "trueshot-agent"
version = "0.1.0"
description = "Trueshot product-accurate car stills agent (ADK graph, image backends, compositor, checks)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[db,mcp,openai]==2.14.1",
    "mcp==1.30.0",
    "asyncpg==0.32.0",
    "boto3==1.44.3",
    "openai>=2.20,<3",
    "fal-client==1.0.3",
    "httpx>=0.28,<1",
    "numpy==2.5.5",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "OpenEXR==3.5.4",
    "pydantic>=2.9,<3",
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "onnxruntime==1.32.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
